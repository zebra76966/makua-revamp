<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />

    <!-- The forest green the site is built around, so the phone browser
         chrome matches the page instead of sitting on black. -->
    <meta name="theme-color" content="#404b2b" />

    <title>Makua Retreats — Ayahuasca &amp; Wellness Retreats in Colombia</title>
    <meta
      name="description"
      content="Ayahuasca ceremonies, cacao circles and wellness retreats at Cerro Tusa, Colombia. Small groups, experienced facilitators, and time to come back to yourself."
    />
    <link rel="canonical" href="https://makuaretreats.com/" />

    <!-- What appears when someone shares a link in a message or a post. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Makua Retreats" />
    <meta property="og:title" content="Makua Retreats — Ayahuasca &amp; Wellness Retreats in Colombia" />
    <meta
      property="og:description"
      content="Ayahuasca ceremonies, cacao circles and wellness retreats at Cerro Tusa, Colombia. Small groups, experienced facilitators, and time to come back to yourself."
    />
    <meta property="og:url" content="https://makuaretreats.com/" />
    <meta property="og:image" content="https://makuaretreats.com/hero.png" />
    <meta property="og:image:alt" content="The Makua retreat grounds at Cerro Tusa" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- Fonts are in public/fonts and loaded by master.css; telling the
         browser early keeps the headings from flashing in a fallback. -->
    <link rel="preload" href="%PUBLIC_URL%/fonts/Horus.otf" as="font" type="font/otf" crossorigin />
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>

      To create a production bundle, use `npm run build` or `yarn build`.

  </body>
</html>
